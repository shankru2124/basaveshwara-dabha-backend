services:
  - type: web
    name: basaveshwara-dabha-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PROJECT_NAME
        value: Basaveshwara Dabha API
      - key: DATABASE_NAME
        value: basaveshwara_dabha
      - key: SECRET_KEY
        generateValue: true
