services:
  - type: web
    name: basaveshwara-dabha-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: backend:.
      - key: PROJECT_NAME
        value: Basaveshwara Dabha API
      - key: DATABASE_NAME
        value: basaveshwara_dabha
      - key: SECRET_KEY
        generateValue: true
